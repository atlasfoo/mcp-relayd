version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - gocritic
    - gosec
    - ineffassign
    - intrange
    - misspell
    - modernize
    - nilerr
    - noctx
    - nolintlint
    - predeclared
    - unconvert
    - usestdlibvars
  settings:
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: strict

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: mcp-relayd
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - mcp-relayd
  exclusions:
    generated: strict
