name: Pipeline Checks

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'justfile'
      - '.golangci.yml'
      - '.cz.toml'
      - 'devenv.nix'
      - 'devenv.yaml'
      - 'devenv.lock'
      - 'tooling/**.py'
      - 'tests/pipeline/**.go'
      - 'tests/pipeline/**.py'
      - 'tests/pipeline/**.sh'
      - 'tests/pipeline/**.toml'
      - 'tests/pipeline/**.json'
      - 'tests/pipeline/**.yaml'
      - 'tests/pipeline/**.yml'
      - 'tests/pipeline/**.lock'
      - 'tests/pipeline/**.mod'
      - 'tests/pipeline/**.sum'
      - 'tests/pipeline/justfile'
      - 'tests/pipeline/**/justfile'
      - 'tests/release/**.go'
      - 'tests/release/**.py'
      - 'tests/release/**.sh'
      - 'tests/release/**.toml'
      - 'tests/release/**.json'
      - 'tests/release/**.yaml'
      - 'tests/release/**.yml'
      - 'tests/release/**.lock'
      - 'tests/release/**.mod'
      - 'tests/release/**.sum'
      - 'tests/release/justfile'
      - 'tests/release/**/justfile'
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - 'justfile'
      - '.golangci.yml'
      - '.cz.toml'
      - 'devenv.nix'
      - 'devenv.yaml'
      - 'devenv.lock'
      - 'tooling/**.py'
      - 'tests/pipeline/**.go'
      - 'tests/pipeline/**.py'
      - 'tests/pipeline/**.sh'
      - 'tests/pipeline/**.toml'
      - 'tests/pipeline/**.json'
      - 'tests/pipeline/**.yaml'
      - 'tests/pipeline/**.yml'
      - 'tests/pipeline/**.lock'
      - 'tests/pipeline/**.mod'
      - 'tests/pipeline/**.sum'
      - 'tests/pipeline/justfile'
      - 'tests/pipeline/**/justfile'
      - 'tests/release/**.go'
      - 'tests/release/**.py'
      - 'tests/release/**.sh'
      - 'tests/release/**.toml'
      - 'tests/release/**.json'
      - 'tests/release/**.yaml'
      - 'tests/release/**.yml'
      - 'tests/release/**.lock'
      - 'tests/release/**.mod'
      - 'tests/release/**.sum'
      - 'tests/release/justfile'
      - 'tests/release/**/justfile'

permissions:
  contents: read

concurrency:
  group: pipeline-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pipeline-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Restore only: Checks remains the sole writer of the shared NAR cache.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/nix-cache
          key: nix-env-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.nix', 'devenv.yaml', 'devenv.lock') }}

      - name: Prepare runner-owned Nix binary cache
        run: |
          install -d -m 0755 "$HOME/nix-cache" "$HOME/nix-cache/nar" "$HOME/nix-cache/realisations" "$HOME/nix-cache/log"

      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.28.5/install
          extra_nix_config: |
            extra-substituters = file:///home/runner/nix-cache?trusted=1 https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=

      - name: Bootstrap pinned devenv
        run: |
          nix build github:cachix/devenv-nixpkgs/c2f38fe7f9e04d9aadd354d380f2bd40531d9737#devenv --out-link "$RUNNER_TEMP/devenv-cli"
          echo "$RUNNER_TEMP/devenv-cli/bin" >> "$GITHUB_PATH"

      - name: Pipeline gate on the exact source SHA
        run: devenv shell -- just check-pipeline
