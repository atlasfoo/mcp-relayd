name: Checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Checks-only binary cache; publication must never restore this namespace.
      # Archive NARs, not a live /nix/store + daemon database with privileged owners.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: nix-cache
        with:
          path: ~/nix-cache
          key: checks-nix-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.nix', 'devenv.yaml', 'devenv.lock') }}

      - name: Prepare runner-owned Nix binary cache
        id: prepare-nix-cache
        # A cold file:// substituter is initialized by the root daemon otherwise.
        run: |
          install -d -m 0755 "$HOME/nix-cache" "$HOME/nix-cache/nar" "$HOME/nix-cache/realisations" "$HOME/nix-cache/log"

      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.28.5/install
          extra_nix_config: |
            extra-substituters = file:///home/runner/nix-cache?trusted=1 https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=

      - name: Bootstrap pinned devenv
        run: |
          nix build github:cachix/devenv-nixpkgs/c2f38fe7f9e04d9aadd354d380f2bd40531d9737#devenv --out-link "$RUNNER_TEMP/devenv-cli"
          echo "$RUNNER_TEMP/devenv-cli/bin" >> "$GITHUB_PATH"

      - name: Checks on the exact source SHA
        env:
          CHECKS_EVENT: ${{ github.event_name }}
          CHECKS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECKS_PR_TITLE: ${{ github.event.pull_request.title }}
          CHECKS_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          CHECKS_HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          RELEASE_BOT_SLUG: ${{ vars.RELEASE_BOT_SLUG }}
          GH_TOKEN: ${{ github.token }}
        run: devenv shell -- just ci-checks

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: checks-metadata
          path: checks-metadata.json
          if-no-files-found: error
          retention-days: 7

      - name: Export Nix binary cache
        if: github.event_name == 'push' && steps.nix-cache.outputs.cache-matched-key == ''
        run: nix copy --all --to "file://$HOME/nix-cache"

      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: github.event_name == 'push' && steps.nix-cache.outputs.cache-matched-key == ''
        with:
          path: ~/nix-cache
          key: checks-nix-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.nix', 'devenv.yaml', 'devenv.lock') }}
