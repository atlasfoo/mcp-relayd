name: Release

on:
  workflow_call:
    inputs:
      producer_attempt:
        required: true
        type: string
      artifact_id:
        required: true
        type: string
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI_JUSTFILE: ${{ github.workspace }}/trusted/justfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false

      # Release consumes the shared NAR cache; it never exports or saves it.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: nix-cache
        with:
          path: ~/nix-cache
          key: nix-env-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('trusted/devenv.nix', 'trusted/devenv.yaml', 'trusted/devenv.lock') }}

      - name: Prepare runner-owned Nix binary cache
        id: prepare-nix-cache
        # A cold file:// substituter is initialized by the root daemon otherwise.
        run: |
          install -d -m 0755 "$HOME/nix-cache" "$HOME/nix-cache/nar" "$HOME/nix-cache/realisations" "$HOME/nix-cache/log"

      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.28.5/install
          extra_nix_config: |
            extra-substituters = file:///home/runner/nix-cache?trusted=1 https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=

      - name: Bootstrap pinned devenv
        run: |
          nix build github:cachix/devenv-nixpkgs/c2f38fe7f9e04d9aadd354d380f2bd40531d9737#devenv --out-link "$RUNNER_TEMP/devenv-cli"
          echo "$RUNNER_TEMP/devenv-cli/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: build-assets
          run-id: ${{ github.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Verify exact Build and Checks API runs
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.run_id }}
          PRODUCER_ATTEMPT: ${{ inputs.producer_attempt }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          cd trusted
          # shellcheck disable=SC2016
          devenv shell -- bash -euo pipefail -c '
            cd "$GITHUB_WORKSPACE"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/build-api.json"
            just --justfile trusted/justfile workflow-handoff "$GITHUB_WORKSPACE/build-assets" "$PRODUCER_ATTEMPT" "$ARTIFACT_ID" "$RUNNER_TEMP/provenance-input.json"
            just --justfile trusted/justfile workflow-provenance release "$RUNNER_TEMP/provenance-input.json" "$RUNNER_TEMP/provenance.json"
            python3 - <<"PY"
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "provenance.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key in ("source_sha", "event", "head_repository", "head_branch"):
                  output.write(f"{key}={result[key]}\n")
          PY
          '

      - name: Read public App bot identity for recovery
        if: steps.provenance.outputs.event == 'push' && steps.provenance.outputs.head_repository == github.repository && steps.provenance.outputs.head_branch == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_APP_SLUG: ${{ vars.RELEASE_BOT_SLUG }}
        run: |
          cd trusted
          devenv shell -- python3 - <<'PY'
          import json, os, re, subprocess
          slug = os.environ["RELEASE_APP_SLUG"]
          if slug:
              if not re.fullmatch(r"[A-Za-z0-9-]+", slug):
                  raise ValueError("invalid App slug")
              user = json.loads(subprocess.check_output(["gh", "api", "users/" + slug + "%5Bbot%5D"]))
              if type(user["id"]) is not int or user["id"] <= 0 or user["login"] != slug + "[bot]":
                  raise ValueError("invalid bot identity")
              with open(os.environ["GITHUB_ENV"], "a") as output:
                  output.write(f"RELEASE_BOT_NAME={slug}[bot]\nRELEASE_BOT_EMAIL={user['id']}+{slug}[bot]@users.noreply.github.com\n")
          PY

      - name: Validate artifacts, eligibility and refreshed refs without App
        if: steps.provenance.outputs.event == 'push' && steps.provenance.outputs.head_repository == github.repository && steps.provenance.outputs.head_branch == 'master'
        id: preflight
        env:
          RELEASE_PREFLIGHT_ONLY: '1'
          RELEASE_READ_TOKEN: ${{ github.token }}
        run: |
          cd trusted
          # shellcheck disable=SC2016
          devenv shell -- bash -euo pipefail -c '
            cd "$GITHUB_WORKSPACE"
            git init "$RUNNER_TEMP/release-input"
            git -C "$RUNNER_TEMP/release-input" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
            just --justfile trusted/justfile --working-directory "$RUNNER_TEMP/release-input" ci-release "$RUNNER_TEMP/provenance.json" "$GITHUB_WORKSPACE/build-assets" "$RUNNER_TEMP/preflight.json"
          '

      - uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        if: steps.preflight.outputs.ready == 'true'
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Derive actual App git identity and publish recoverably
        if: steps.preflight.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          RELEASE_READ_TOKEN: ${{ github.token }}
        run: |
          cd trusted
          # shellcheck disable=SC2016
          devenv shell -- bash -euo pipefail -c '
            cd "$GITHUB_WORKSPACE"
            python3 - <<"PY"
          import json, os, re, subprocess
          from pathlib import Path
          slug = os.environ["RELEASE_APP_SLUG"]
          if not re.fullmatch(r"[A-Za-z0-9-]+", slug):
              raise ValueError("invalid App slug")
          user = json.loads(subprocess.check_output(["gh", "api", "users/" + slug + "%5Bbot%5D"]))
          if type(user["id"]) is not int or user["id"] <= 0 or user["login"] != slug + "[bot]":
              raise ValueError("invalid App bot")
          user_id = user["id"]
          env = dict(os.environ, RELEASE_BOT_NAME=slug + "[bot]", RELEASE_BOT_EMAIL=f"{user_id}+{slug}[bot]@users.noreply.github.com")
          subprocess.run(["just", "--justfile", "trusted/justfile", "--working-directory", str(Path(os.environ["RUNNER_TEMP"]) / "release-input"), "ci-release", str(Path(os.environ["RUNNER_TEMP"]) / "provenance.json"), str(Path.cwd() / "build-assets"), str(Path(os.environ["RUNNER_TEMP"]) / "publication.json")], env=env, check=True)
          PY
          '
